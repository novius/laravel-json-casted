name: Novius CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-php:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Lint PHP code via Laravel Pint
      run: composer run-script lint

  test-php:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        laravel: [ 10.*, 11.*, 12.*, 13.* ]
        dependency-version: [ prefer-stable ]
        exclude:
          - php-versions: '8.2'
            laravel: 13.*
          - php-versions: '8.5'
            laravel: 10.*
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: 3.*
            boost: 2.*
          - laravel: 12.*
            testbench: 10.*
            carbon: 3.*
            boost: 2.*
          - laravel: 11.*
            testbench: 9.*
            carbon: 2.*
            boost: 2.*
          - laravel: 10.*
            testbench: 8.*
            carbon: 2.*
            boost: 1.*

    name: test - P${{ matrix.php-versions }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "nesbot/carbon:${{ matrix.carbon }}" "orchestra/testbench:${{ matrix.testbench }}" "laravel/boost:${{ matrix.boost }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Test
        run: composer run-script test

  phpstan:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        laravel: [ 10.*, 11.*, 12.*, 13.* ]
        dependency-version: [ prefer-stable ]
        exclude:
          - php-versions: '8.2'
            laravel: 13.*
          - php-versions: '8.5'
            laravel: 10.*
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: 3.*
            boost: 2.*
          - laravel: 12.*
            testbench: 10.*
            carbon: 3.*
            boost: 2.*
          - laravel: 11.*
            testbench: 9.*
            carbon: 2.*
            boost: 2.*
          - laravel: 10.*
            testbench: 8.*
            carbon: 2.*
            boost: 1.*

    name: phpstan - P${{ matrix.php-versions }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "nesbot/carbon:${{ matrix.carbon }}" "orchestra/testbench:${{ matrix.testbench }}" "laravel/boost:${{ matrix.boost }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: PHPStan Static Analysis
        run: composer run-script phpstan
